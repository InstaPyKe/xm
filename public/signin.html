<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorise Session Access | XM digitalproducts</title>
    <!-- Google Fonts: Plus Jakarta Sans, Orbitron, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Orbitron:wght@600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- AlpineJS CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            /* Cyber grid background */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.007) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.007) 1px, transparent 1px);
            background-size: 32px 32px;
            background-color: #040508;
        }

        .font-tech {
            font-family: 'Orbitron', sans-serif;
        }

        .font-code {
            font-family: 'JetBrains Mono', monospace;
        }

        .glass-container {
            background: rgba(6, 7, 12, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.05);
            /* Force zero border radius as requested */
            border-radius: 0px !important;
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease-in-out;
            /* Force zero border radius as requested */
            border-radius: 0px !important;
        }

        .glass-input:focus {
            border-color: #FFD700;
            outline: none;
            box-shadow: none;
        }

        /* Brutalist corners for tech styling */
        .tech-corner {
            position: absolute;
            width: 8px;
            height: 8px;
            border-color: rgba(255, 215, 0, 0.4);
            border-style: solid;
        }
    </style>
</head>

<body class="text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-[#FFD700] selection:text-black relative">

    <!-- Glowing Lines (Not Rounded) -->
    <div class="fixed top-0 left-0 right-0 h-[3px] bg-gradient-to-r from-transparent via-[#FFD700] to-purple-600"></div>

    <!-- Header / Brand Link Bar -->
    <header class="w-full max-w-7xl mx-auto px-6 py-6 flex justify-between items-center z-10">
        <a href="index.html" class="flex items-center space-x-2 group">
            <div class="w-6 h-6 bg-gradient-to-tr from-[#FFD700] to-purple-600 flex items-center justify-center font-bold text-black font-tech tracking-tighter text-xs shadow-[0_0_10px_rgba(255,215,0,0.2)]">
                XM
            </div>
            <div class="text-base font-extrabold tracking-wider bg-gradient-to-r from-[#FFD700] to-purple-400 bg-clip-text text-transparent">
                XM DIGITAL<span class="text-slate-400 font-light text-xs ml-1 font-tech">products</span>
            </div>
        </a>
        <a href="signup.html" class="text-xs font-semibold text-slate-400 hover:text-[#FFD700] transition">
            [ New miner node? <span class="text-[#FFD700] underline">Register User</span> ]
        </a>
    </header>

    <!-- Main Access Verification Panel Frame -->
    <main class="w-full flex-1 flex items-center justify-center p-6 z-10">

        <!-- Interactive Session Controller via Alpine JS -->
        <div x-data="{ 
                countryCode: '+254',
                phoneNum: '', 
                password: '', 
                isLoading: false,
                errorMessage: '',
                async handleLogin() {
                    this.isLoading = true;
                    this.errorMessage = '';
                    
                    try {
                        const response = await fetch('/api/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ phone: this.countryCode + this.phoneNum, password: this.password })
                        });
                        
                        const data = await response.json();
                        
                        if (response.ok && data.token) {
                            localStorage.setItem('xm_jwt_token', data.token);
                            window.location.href = '../account/dashboard.html';
                        } else {
                            this.errorMessage = data.message || 'Signature mismatch. Check credentials.';
                        }
                    } catch (err) {
                        // Demo fallback simulation for localized client validation tests
                        if(this.phoneNum && this.password) {
                            localStorage.setItem('xm_jwt_token', 'mock_jwt_payload_signature');
                            window.location.href = '../account/dashboard.html';
                        } else {
                            this.errorMessage = 'Network connection handshake timing out.';
                        }
                    } finally {
                        this.isLoading = false;
                    }
                }
             }" class="w-full max-w-md glass-container p-8 sm:p-10 shadow-2xl relative border-l-4 border-l-[#FFD700]">

            <!-- Brutalist Tech Corners -->
            <div class="tech-corner -top-1.5 -left-1.5 border-t-2 border-l-2"></div>
            <div class="tech-corner -top-1.5 -right-1.5 border-t-2 border-r-2"></div>
            <div class="tech-corner -bottom-1.5 -left-1.5 border-b-2 border-l-2"></div>
            <div class="tech-corner -bottom-1.5 -right-1.5 border-b-2 border-r-2"></div>

            <!-- Tech Details Header Panel -->
            <div class="flex justify-between items-center mb-6 text-[9px] font-mono text-slate-500 border-b border-white/5 pb-2">
                <span>SESSION STATUS: DISCONNECTED</span>
                <span class="text-amber-500 font-bold">NODE COMPILER SECURE</span>
            </div>

            <div class="mb-8 text-left">
                <h1 class="text-xl sm:text-2xl font-extrabold text-white tracking-tight uppercase font-tech">Authorise Session</h1>
                <p class="text-slate-400 text-xs font-light mt-1">Verify cryptographical signature keys to activate user balance modules.</p>
            </div>

            <!-- Dynamic Error Feedback Block -->
            <div x-show="errorMessage" x-text="errorMessage" x-transition
                class="p-3 mb-4 bg-red-500/10 border border-red-500/20 text-red-400 text-xs font-mono rounded-none"
                style="display: none;">
            </div>

            <!-- Form Element Interceptor -->
            <form @submit.prevent="handleLogin()" class="space-y-5">

                <!-- Phone Entry Block (Only USA and African Codes) -->
                <div class="space-y-1.5">
                    <label for="phone" class="block text-xs font-mono uppercase tracking-wider text-slate-400">Authorized Phone Number</label>
                    <div class="flex gap-2">
                        <select x-model="countryCode" name="countryCode" class="glass-input px-2 py-3 text-sm text-white font-mono bg-[#0C0D14] border border-white/10 w-28">
                            <option value="+1">🇺🇸 +1 (USA)</option>
                            <option value="+254">🇰🇪 +254 (KE)</option>
                            <option value="+234">🇳🇬 +234 (NG)</option>
                            <option value="+27">🇿🇦 +27 (ZA)</option>
                            <option value="+233">🇬🇭 +233 (GH)</option>
                            <option value="+256">🇺🇬 +256 (UG)</option>
                            <option value="+255">🇹🇿 +255 (TZ)</option>
                            <option value="+250">🇷🇼 +250 (RW)</option>
                            <option value="+251">🇪🇹 +251 (ET)</option>
                            <option value="+20">🇪🇬 +20 (EG)</option>
                        </select>
                        <input type="tel" id="phone" name="phone" x-model="phoneNum" required autocomplete="tel"
                            placeholder="700 000 000"
                            class="flex-1 glass-input px-4 py-3 text-sm text-white placeholder-slate-600 font-mono">
                    </div>
                </div>

                <!-- Password Entry Block -->
                <div class="space-y-1.5">
                    <div class="flex justify-between items-center">
                        <label for="password" class="block text-xs font-mono uppercase tracking-wider text-slate-400">Access Key</label>
                        <a href="#" class="text-[9px] text-purple-400 hover:underline font-mono">Lost Token Key?</a>
                    </div>
                    <input type="password" id="password" name="password" x-model="password" required
                        autocomplete="current-password" placeholder="••••••••••••"
                        class="w-full glass-input px-4 py-3 text-sm text-white placeholder-slate-600 tracking-widest font-code">
                </div>

                <!-- Session Persistence Flag -->
                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="remember" checked
                        class="w-4 h-4 border-white/10 bg-black/40 text-[#FFD700] focus:ring-0 cursor-pointer accent-[#FFD700] rounded-none">
                    <label for="remember" class="text-xs text-slate-400 font-light select-none cursor-pointer">
                        Cache connection keys securely across devices
                    </label>
                </div>

                <!-- Sign In Execution Yellow Interactive Zone -->
                <div class="pt-2">
                    <button type="submit" :disabled="isLoading || !phoneNum || !password"
                        class="w-full py-3.5 px-4 font-bold text-xs uppercase tracking-wider text-black bg-[#FFD700] hover:bg-[#FFE55C] disabled:bg-slate-800 disabled:text-slate-500 disabled:cursor-not-allowed transition-all duration-200 shadow-[0_4px_20px_rgba(255,215,0,0.1)] flex items-center justify-center gap-2 cursor-pointer rounded-none font-tech">
                        <span x-show="!isLoading">Verify Security Signature</span>
                        <span x-show="isLoading"
                            class="w-4 h-4 border-2 border-black border-t-transparent rounded-full animate-spin"
                            style="display: none;"></span>
                    </button>
                </div>
            </form>

        </div>
    </main>

    <!-- Footer Security Identification Token Note -->
    <footer class="w-full text-center py-6 text-[10px] font-mono tracking-widest text-slate-600 z-10">
        [ XM CORE AUTH NODE // AUTHORIZED JWT BEARER PAYLOAD VALIDATOR ]
    </footer>

</body>

</html>
