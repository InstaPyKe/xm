<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Console</title>
    <!-- Google Fonts: JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #020204;
            color: #10b981;
            overflow: hidden;
            width: 200px;
            height: 600px;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
        .glow-text-green {
            text-shadow: 0 0 5px rgba(16, 185, 129, 0.5);
        }
        .glow-text-yellow {
            text-shadow: 0 0 5px rgba(245, 158, 11, 0.5);
        }
        .glow-text-red {
            text-shadow: 0 0 5px rgba(239, 68, 68, 0.5);
        }
        .blink {
            animation: blinker 1s step-end infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="p-2 border border-white/10 flex flex-col justify-between" x-data="{
    logs: [],
    filter: 'all',
    loading: true,
    async fetchLogs() {
        try {
            const res = await fetch('/api/system/logs');
            if (res.ok) {
                this.logs = await res.json();
            }
        } catch (e) {
            console.error('Failed to fetch logs', e);
        } finally {
            this.loading = false;
        }
    },
    get filteredLogs() {
        if (this.filter === 'all') return this.logs;
        return this.logs.filter(l => l.level === this.filter);
    },
    init() {
        this.fetchLogs();
        setInterval(() => this.fetchLogs(), 3000);
        // Auto scroll to bottom
        this.$watch('logs', () => {
            this.$nextTick(() => {
                const container = this.$refs.logContainer;
                if (container) container.scrollTop = container.scrollHeight;
            });
        });
    }
}">
    <!-- Terminal Header -->
    <div class="border-b border-white/10 pb-1 flex flex-col space-y-1 select-none">
        <div class="flex items-center justify-between">
            <span class="text-[9px] font-bold text-white uppercase tracking-wider font-mono glow-text-green">XM_SYS_LOGS</span>
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-ping"></span>
        </div>
        
        <!-- Filter Tabs -->
        <div class="flex justify-between text-[7px] font-bold pt-1 font-mono text-slate-500">
            <button @click="filter = 'all'" :class="filter === 'all' ? 'text-white' : ''" class="hover:text-white transition cursor-pointer">ALL</button>
            <button @click="filter = 'info'" :class="filter === 'info' ? 'text-emerald-400' : ''" class="hover:text-emerald-400 transition cursor-pointer">INF</button>
            <button @click="filter = 'warning'" :class="filter === 'warning' ? 'text-amber-400' : ''" class="hover:text-amber-400 transition cursor-pointer">WRN</button>
            <button @click="filter = 'error'" :class="filter === 'error' ? 'text-red-400' : ''" class="hover:text-red-400 transition cursor-pointer">ERR</button>
        </div>
    </div>

    <!-- Terminal Messages Box -->
    <div x-ref="logContainer" class="flex-1 my-2 overflow-y-auto space-y-2 text-[9px] font-mono pr-0.5 leading-tight select-all">
        <template x-if="loading">
            <div class="text-slate-500 text-center py-4">
                LOADING SYS CONSOLE...
            </div>
        </template>
        
        <template x-if="!loading && filteredLogs.length === 0">
            <div class="text-slate-600 text-center py-4">
                NO RECORDED ENTRIES
            </div>
        </template>

        <template x-for="log in [...filteredLogs].reverse()" :key="log.created_at">
            <div class="border-l border-white/5 pl-1.5 py-0.5">
                <div class="flex justify-between text-[7px] text-slate-600">
                    <span x-text="new Date(log.created_at).toLocaleTimeString('en-US', {hour12:false})"></span>
                    <span class="uppercase font-bold" 
                        :class="{
                            'text-emerald-500': log.level === 'info',
                            'text-amber-500': log.level === 'warning',
                            'text-red-500': log.level === 'error'
                        }"
                        x-text="log.level">
                    </span>
                </div>
                <div class="mt-0.5 break-words font-light font-mono"
                    :class="{
                        'text-emerald-400/90': log.level === 'info',
                        'text-amber-400/90': log.level === 'warning',
                        'text-red-400/90': log.level === 'error'
                    }"
                    x-text="log.message">
                </div>
            </div>
        </template>
    </div>

    <!-- Terminal Footer -->
    <div class="border-t border-white/10 pt-1 text-[7px] text-slate-600 flex justify-between select-none">
        <span>STATUS: ACTIVE</span>
        <span>SYS_V1.0 <span class="blink">_</span></span>
    </div>

    <!-- AlpineJS CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
