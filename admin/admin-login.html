<!DOCTYPE html>
<html lang="en" x-data="{ lightMode: localStorage.getItem('xm_theme') === 'light' }" :class="lightMode ? 'light theme-light' : ''">

<head>
    <script>
        if (localStorage.getItem('xm_theme') === 'light') {
            document.documentElement.classList.add('theme-light', 'light');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Administrative Authority Verification | XM Digital</title>
    
    <!-- Google Fonts: Plus Jakarta Sans, Orbitron, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Orbitron:wght@600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- AlpineJS CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #040508;
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 215, 0, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(147, 51, 234, 0.06) 0px, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
            transition: background-color 0.3s, color 0.3s;
        }

        .light body {
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(217, 119, 6, 0.04) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(124, 58, 237, 0.04) 0px, transparent 50%),
                linear-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
            color: #0f172a;
        }

        .font-tech {
            font-family: 'Orbitron', sans-serif;
        }

        .font-code {
            font-family: 'JetBrains Mono', monospace;
        }

        .glass-container {
            background: rgba(8, 12, 22, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .light .glass-container {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.2s ease-in-out;
        }

        .light .glass-input {
            background: rgba(241, 245, 249, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.15);
            color: #0f172a;
        }

        .glass-input:focus {
            border-color: #FFD700;
            outline: none;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.15);
        }

        .tech-corner {
            position: absolute;
            width: 8px;
            height: 8px;
            border-color: rgba(255, 215, 0, 0.5);
            border-style: solid;
        }
    </style>
</head>

<body class="text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-[#FFD700] selection:text-black relative">

    <!-- Glowing Header Border -->
    <div class="fixed top-0 left-0 right-0 h-[3px] bg-gradient-to-r from-amber-500 via-[#FFD700] to-purple-600 z-50"></div>

    <!-- Header Navigation -->
    <header class="w-full max-w-7xl mx-auto px-4 sm:px-6 py-4 sm:py-6 flex justify-between items-center z-10">
        <a href="../public/index.html" class="flex items-center space-x-2.5 group">
            <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-gradient-to-tr from-[#FFD700] to-purple-600 flex items-center justify-center font-bold text-black font-tech tracking-tighter text-xs sm:text-sm shadow-[0_0_12px_rgba(255,215,0,0.3)]">
                XM
            </div>
            <div class="text-sm sm:text-base font-extrabold tracking-wider bg-gradient-to-r from-[#FFD700] to-purple-400 bg-clip-text text-transparent">
                XM DIGITAL<span class="text-slate-400 font-light text-[10px] sm:text-xs ml-1 font-tech">ADMIN</span>
            </div>
        </a>
        
        <div class="flex items-center space-x-3">
            <!-- Light/Dark Mode Switcher -->
            <button @click="lightMode = !lightMode; localStorage.setItem('xm_theme', lightMode ? 'light' : 'dark'); if(lightMode){ document.documentElement.classList.add('theme-light', 'light'); } else { document.documentElement.classList.remove('theme-light', 'light'); }" 
                class="p-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 light:border-black/10 transition cursor-pointer" title="Toggle Theme">
                <svg x-show="!lightMode" class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z" />
                </svg>
                <svg x-show="lightMode" class="w-4 h-4 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display: none;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
            </button>
            <a href="../public/index.html" class="text-xs font-semibold text-slate-400 hover:text-[#FFD700] transition px-2.5 py-1.5 rounded-lg border border-white/5 hover:border-[#FFD700]/30 bg-white/[0.02]">
                Portal
            </a>
        </div>
    </header>

    <!-- Main Login Card -->
    <main class="w-full flex-1 flex items-center justify-center p-4 sm:p-6 z-10">
        <div x-data="{ 
                pin: '', 
                isLoading: false,
                errorMessage: '',
                async handleAdminLogin() {
                    if (this.pin.length !== 6) {
                        this.errorMessage = 'Admin verification code must be exactly 6 digits.';
                        return;
                    }
                    this.isLoading = true;
                    this.errorMessage = '';
                    
                    try {
                        const response = await fetch('/api/admin/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ pin: this.pin })
                        });
                        
                        const data = await response.json();
                        
                        if (response.ok && data.token) {
                            localStorage.setItem('xm_admin_token', data.token);
                            window.location.href = 'admin.html';
                        } else {
                            this.errorMessage = data.message || 'Signature mismatch. Verification failed.';
                        }
                    } catch (err) {
                        this.errorMessage = 'Network connection handshake timing out.';
                    } finally {
                        this.isLoading = false;
                    }
                }
             }" class="w-full max-w-md glass-container p-6 sm:p-10 rounded-2xl sm:rounded-3xl relative border-l-4 border-l-[#FFD700]">

            <!-- Brutalist Tech Corners -->
            <div class="tech-corner -top-1.5 -left-1.5 border-t-2 border-l-2"></div>
            <div class="tech-corner -top-1.5 -right-1.5 border-t-2 border-r-2"></div>
            <div class="tech-corner -bottom-1.5 -left-1.5 border-b-2 border-l-2"></div>
            <div class="tech-corner -bottom-1.5 -right-1.5 border-b-2 border-r-2"></div>

            <div class="flex justify-between items-center mb-5 text-[10px] font-mono text-slate-400 light:text-slate-500 border-b border-white/10 light:border-slate-200 pb-2.5">
                <span class="flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    SECURITY: CONSOLE AUTH
                </span>
                <span class="text-purple-400 light:text-purple-600 font-bold tracking-wider">RESTRICTED</span>
            </div>

            <div class="mb-6 text-left">
                <h1 class="text-xl sm:text-2xl font-extrabold text-white light:text-slate-900 tracking-tight uppercase font-tech">Admin Authority</h1>
                <p class="text-slate-400 light:text-slate-600 text-xs mt-1">Enter your 6-digit administrative security code to unlock management controls.</p>
            </div>

            <div x-show="errorMessage" x-text="errorMessage" x-transition
                class="p-3 mb-4 bg-red-500/10 border border-red-500/20 text-red-400 text-xs font-mono rounded-xl"
                style="display: none;">
            </div>

            <form @submit.prevent="handleAdminLogin()" class="space-y-5">
                <!-- PIN Entry Block -->
                <div class="space-y-1.5">
                    <div class="flex justify-between items-center">
                        <label for="pin" class="block text-xs font-mono uppercase tracking-wider text-slate-300 light:text-slate-700 font-bold">Admin Security PIN</label>
                        <span class="text-[10px] font-mono text-slate-500">6 digits</span>
                    </div>
                    <input type="password" id="pin" name="pin" x-model="pin" required maxlength="6"
                        pattern="[0-9]*" inputmode="numeric" placeholder="••••••" autofocus
                        class="w-full glass-input px-4 py-3.5 text-center text-xl sm:text-2xl text-white light:text-slate-900 placeholder-slate-600 tracking-[0.6em] font-code rounded-xl">
                </div>

                <div class="pt-2">
                    <button type="submit" :disabled="isLoading || pin.length !== 6"
                        class="w-full py-4 px-5 font-bold text-xs sm:text-sm uppercase tracking-wider text-black bg-[#FFD700] hover:bg-[#FFE55C] disabled:bg-slate-800 disabled:text-slate-500 disabled:cursor-not-allowed transition-all duration-200 shadow-[0_4px_20px_rgba(255,215,0,0.2)] flex items-center justify-center gap-2 cursor-pointer rounded-xl font-tech active:scale-[0.98]">
                        <span x-show="!isLoading">Authorize Admin Access</span>
                        <span x-show="isLoading"
                            class="w-4 h-4 border-2 border-black border-t-transparent rounded-full animate-spin"
                            style="display: none;"></span>
                    </button>
                </div>
            </form>

            <div class="mt-6 pt-4 border-t border-white/5 light:border-slate-200 text-center">
                <span class="text-[10px] font-mono text-slate-500 light:text-slate-400">
                    PIN default: 222222 (Authorized Personnel Only)
                </span>
            </div>
        </div>
    </main>

    <footer class="w-full text-center py-4 sm:py-6 text-[10px] font-mono tracking-widest text-slate-500 light:text-slate-400 z-10 px-4">
        &copy; 2026 XM DIGITAL ADMINISTRATIVE GATEWAY
    </footer>

</body>
</html>
